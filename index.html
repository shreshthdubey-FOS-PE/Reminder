        {

          activityDate: base.add(4, "hour").minute(30).second(0).format("YYYY-MM-DDTHH:mm:ss"),
          durationHours: 0,

          party: "Agility Logistics",

    // Helper: Format Date String nicely
    const formatDateTime = (isoString) => {
      if (!isoString) return "-";
      return dayjs(isoString).format("MMM D, YYYY, h:mm:ss A");
    };

    const formatDateShort = (isoString) => {
      if (!isoString) return "-";
      return dayjs(isoString).format("MMM D, YYYY, h:mm A");
    };

    // Main Prototype Component
    function FreightoscopeApp() {
      // Custom time control - allows setting a specific time for testing
      const [useCustomTime, setUseCustomTime] = useState(false);
      const [customTime, setCustomTime] = useState(() => dayjs().format("YYYY-MM-DDTHH:mm"));
      const [currentTime, setCurrentTime] = useState(() => dayjs().toISOString());
      const [timezone, setTimezone] = useState("Asia/Kolkata (GMT+5:30)");
      const [isDevToolOpen, setIsDevToolOpen] = useState(false);
      const [justSavedOrChangedTime, setJustSavedOrChangedTime] = useState(false);

      // Update current time based on mode (real or custom)
      useEffect(() => {
        if (!useCustomTime) {
          // Use real current time
          setCurrentTime(dayjs().toISOString());
          const timer = setInterval(() => {
            setCurrentTime(dayjs().toISOString());
          }, 60000); // Update every 60 seconds
          return () => clearInterval(timer);
        }
      }, [useCustomTime]);

      // Navigation State
      const [activeNav, setActiveNav] = useState("activities"); // "activities" | "settings"
      const [settingsTab, setSettingsTab] = useState("activity-reminder"); // "lead-stage" | "opp-stage" | "activity-status" | "activity-reminder"
      const [activitySubTab, setActivitySubTab] = useState("all"); // "all" | "Calls" | "Email" | "Meeting" | "Task"
      const [searchQuery, setSearchQuery] = useState("");

      // Settings State
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem("fs_reminder_settings");
        return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
      });

      // Helper to dynamically adjust activity dates to the current day if saved data is from a past/different date
      const autoUpdateActivitiesToCurrentDate = (items) => {
        if (!items || items.length === 0) return getInitialActivities();
        
        const now = dayjs();
        const firstActDate = dayjs(items[0].activityDate);
        
        // If the saved data is from a previous calendar day, shift all activity dates to today's date
        if (!firstActDate.isSame(now, "day")) {
          const diffDays = now.startOf("day").diff(firstActDate.startOf("day"), "day");
          return items.map((act) => {
            const originalDate = dayjs(act.activityDate);
            const shiftedDate = originalDate.add(diffDays, "day");
            const isFuture = shiftedDate.isSameOrAfter(now);
            return {
              ...act,
              activityDate: shiftedDate.format("YYYY-MM-DDTHH:mm:ss"),
              hasReminder: isFuture
            };
          });
        }
        return items;
      };

      // Activities State
      const [activities, setActivities] = useState(() => {
        const saved = localStorage.getItem("fs_activities");
        if (saved) {
          const parsed = JSON.parse(saved);
          const cleaned = parsed.map((a) => ({
            ...a,
            contacts: a.contacts ? a.contacts.replace(/\s*\([^)]*\)/g, "") : a.contacts
          }));
          if (cleaned.length < 8) return getInitialActivities();
          return autoUpdateActivitiesToCurrentDate(cleaned);
        }
        return getInitialActivities();
      });

      // Drawer & Modal States
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [editingActivity, setEditingActivity] = useState(null);
      const [isNotificationOpen, setIsNotificationOpen] = useState(false);
      const [editingSetting, setEditingSetting] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [notifTab, setNotifTab] = useState("all"); // "all" | "read" | "unread"
      const [notifSearchQuery, setNotifSearchQuery] = useState("");

      // Form State for Drawer
      const [formData, setFormData] = useState({
        activityType: "Calls",
        title: "",
        party: "",
        opportunity: "",
        contacts: "",
        activityDate: "2026-09-09T16:00:00",
        durationHours: 0,
        durationMinutes: 15,
        reminderDurationMinutes: 15,
        isReminderUserOverridden: false,
        direction: "Outbound",
        purpose: "Sales Pitch",
        outcome: "New",
        status: "New",
        priority: "Low",
        owner: "Shreshth Dubey",
        teamMembers: [],
        notes: ""
      });

      // Persist Settings & Activities
      useEffect(() => {
        localStorage.setItem("fs_reminder_settings", JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem("fs_activities", JSON.stringify(activities));
      }, [activities]);

      // Show Toast Utility
      const showToast = (msg, type = "success") => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Reminders Snooze & Dismiss State
      const [dismissedReminders, setDismissedReminders] = useState(() => {
        const saved = localStorage.getItem("fs_dismissed_reminders");
        return saved ? JSON.parse(saved) : [];
      });

      const [snoozedReminders, setSnoozedReminders] = useState(() => {
        const saved = localStorage.getItem("fs_snoozed_reminders");
        return saved ? JSON.parse(saved) : {};
      });

      // Persist Snooze & Dismiss
      useEffect(() => {
        localStorage.setItem("fs_dismissed_reminders", JSON.stringify(dismissedReminders));
      }, [dismissedReminders]);

      useEffect(() => {
        localStorage.setItem("fs_snoozed_reminders", JSON.stringify(snoozedReminders));
      }, [snoozedReminders]);

      // ==========================================
      // REMINDER ENGINE (Rules AC1 - AC18 + Alert Modal + Snooze / Dismiss)
      // ==========================================
      // Automatically derive and evaluate all Reminders based on Activities and Current Time
      const reminders = useMemo(() => {
        const now = dayjs(currentTime);
        const list = [];

        activities.forEach((act) => {
          const actDate = dayjs(act.activityDate);

          // A reminder exists if explicitly enabled (scheduled for future date when created/saved)
          const hasReminder = act.hasReminder !== undefined
            ? act.hasReminder
            : actDate.isSameOrAfter(dayjs(act.createdAt || "2026-09-09T15:00:00"));

          if (!hasReminder) {
            return;
          }

          const remId = `REM-${act.id}`;
          const duration = act.reminderDurationMinutes || 15;
          const defaultTriggerDate = actDate.subtract(duration, "minute");

          // Check Snooze & Dismiss state
          const snoozedUntilStr = snoozedReminders[remId];
          const isSnoozedActive = Boolean(snoozedUntilStr && dayjs(snoozedUntilStr).isAfter(now));
          const effectiveTriggerDate = (snoozedUntilStr && !isSnoozedActive) 
            ? dayjs(snoozedUntilStr) 
            : defaultTriggerDate;

          const isTriggered = now.isSameOrAfter(effectiveTriggerDate);
          const isDismissed = dismissedReminders.includes(remId);

          let statusText = "Scheduled";
          if (isDismissed) {
            statusText = "Dismissed / Read";
          } else if (isSnoozedActive) {
            statusText = `Snoozed (until ${dayjs(snoozedUntilStr).format("h:mm A")})`;
          } else if (isTriggered) {
            statusText = "ALERTING (Due Now)";
          }

          list.push({
            id: remId,
            activityId: act.id,
            subject: act.title || "Untitled Activity",
            activityType: act.activityType,
            activityDate: act.activityDate,
            reminderDate: defaultTriggerDate.toISOString(),
            effectiveTriggerDate: effectiveTriggerDate.toISOString(),
            durationMinutes: duration,
            source: "Sales Activity",
            sourceNumber: "", // Prompt AC15: Source Number remains empty
            timezone: timezone,
            status: statusText,
            isPending: !isDismissed && !isSnoozedActive && !isTriggered,
            isTriggered: isTriggered,
            isDismissed: isDismissed,
            isSnoozed: isSnoozedActive,
            isAlerting: isTriggered && !isDismissed && !isSnoozedActive,
            party: act.party,
            opportunity: act.opportunity,
            contacts: act.contacts,
            notes: act.notes,
            owner: act.owner
          });
        });

        return list;
      }, [activities, currentTime, timezone, dismissedReminders, snoozedReminders]);

      // Reminders that are currently triggering
      const activeAlertingReminders = useMemo(() => {
        return reminders.filter((r) => r.isAlerting);
      }, [reminders]);

      // Active reminder to display in the central On-Screen Popup Modal (opens automatically when trigger time is reached)
      const activeAlertModalReminder = useMemo(() => {
        if (justSavedOrChangedTime) return null; // Grace period during demos to prevent immediate popup slam
        return activeAlertingReminders.find((r) => !r.isDismissed) || null;
      }, [activeAlertingReminders, justSavedOrChangedTime]);

      // Filtered reminders for the Notifications Panel (All / Read / Unread + Search)
      const filteredNotificationReminders = useMemo(() => {
        return reminders.filter((rem) => {
          // Tab filter
          if (notifTab === "read" && !rem.isDismissed) return false;
          if (notifTab === "unread" && rem.isDismissed) return false;

          // Search filter
          if (notifSearchQuery.trim()) {
            const q = notifSearchQuery.toLowerCase();
            const titleMatch = rem.subject.toLowerCase().includes(q);
            const partyMatch = rem.party ? rem.party.toLowerCase().includes(q) : false;
            const ownerMatch = rem.owner ? rem.owner.toLowerCase().includes(q) : false;
            return titleMatch || partyMatch || ownerMatch;
          }
          return true;
        });
      }, [reminders, notifTab, notifSearchQuery]);

      // Snooze & Dismiss Action Handlers
      const handleSnoozeReminder = (reminderId, minutes) => {
        const snoozeUntil = dayjs(currentTime).add(minutes, "minute").toISOString();
        setSnoozedReminders((prev) => ({
          ...prev,
          [reminderId]: snoozeUntil
        }));
        showToast(`Reminder snoozed for ${minutes} min (until ${dayjs(snoozeUntil).format("h:mm A")}).`);
      };

      const handleDismissReminder = (reminderId) => {
        setDismissedReminders((prev) => {
          if (!prev.includes(reminderId)) return [...prev, reminderId];
          return prev;
        });
        setSnoozedReminders((prev) => {
          const next = { ...prev };
          delete next[reminderId];
          return next;
        });
        showToast("Reminder marked as read and dismissed.");
      };

      const handleDismissAllReminders = () => {
        const allPending = reminders.filter(r => !r.isDismissed).map((r) => r.id);
        setDismissedReminders((prev) => Array.from(new Set([...prev, ...allPending])));
        showToast("All notifications dismissed.");
      };

      const handleMarkAllRead = () => {
        const allIds = reminders.map((r) => r.id);
        setDismissedReminders(allIds);
        showToast("All notifications marked as read.");
      };

      // Dev Time Controller Fast-Forward & Reset
      const handleFastForward = (minutes) => {
        const baseTime = dayjs(customTime || currentTime);
        const nextTime = baseTime.add(minutes, "minute").format("YYYY-MM-DDTHH:mm");
        setCustomTime(nextTime);
      };

      const handleResetRealTime = () => {
        setUseCustomTime(false);
        const realNow = dayjs().format("YYYY-MM-DDTHH:mm");
        setCustomTime(realNow);
        setCurrentTime(dayjs().toISOString());
        setJustSavedOrChangedTime(true);
        setTimeout(() => setJustSavedOrChangedTime(false), 3000);
        showToast("Reset clock to real system time.");

      const handleApplyCustomTime = () => {
        if (customTime) {
          setCurrentTime(dayjs(customTime).toISOString());
          setUseCustomTime(true);
          setIsDevToolOpen(false);
          setJustSavedOrChangedTime(true);
          setTimeout(() => setJustSavedOrChangedTime(false), 3000);
          showToast(`Simulated time set to ${dayjs(customTime).format("h:mm A")}.`);
        } else {
          setIsDevToolOpen(false);
        }

      // Dynamic Title & Icon based on Activity Type for Enterprise Reminder Popup Modal
      const getReminderHeaderInfo = (type) => {
        switch ((type || "").toLowerCase()) {
          case "calls":
            return { title: "Upcoming Phone Call Reminder", icon: "fa-solid fa-phone" };
          case "meeting":
            return { title: "Upcoming Meeting Reminder", icon: "fa-solid fa-calendar-check" };
          case "email":
            return { title: "Email Action Reminder", icon: "fa-solid fa-envelope-open-text" };
          case "task":
            return { title: "Task Reminder", icon: "fa-solid fa-list-check" };

            return { title: "Upcoming Activity Reminder", icon: "fa-solid fa-bell" };

      };

      const getDefaultDurationForType = (type) => {
        const row = settings.find((s) => s.activityType.toLowerCase() === type.toLowerCase());
        return row ? row.durationMinutes : 15;
      };

      // Open Drawer for New Activity
      const handleOpenCreateDrawer = (presetType = "Calls") => {
        const defaultDur = getDefaultDurationForType(presetType);
        // Default activity time: 1 hour from current simulated time
        const defaultActTime = dayjs(currentTime).add(1, "hour").minute(0).second(0).format("YYYY-MM-DDTHH:mm:00");

        setEditingActivity(null);
        setFormData({
          activityType: presetType,
          title: "",
          party: "Select Party or Lead",
          opportunity: "Select Opportunity",
          contacts: "Select Contacts",
          activityDate: defaultActTime,
          durationHours: 0,
          durationMinutes: 30,
          reminderDurationMinutes: defaultDur,
          isReminderUserOverridden: false,
          direction: presetType === "Calls" ? "Select Call Direction" : "Select Direction",
          purpose: presetType === "Calls" ? "Select Call Purpose" : "Select Purpose",
          outcome: presetType === "Calls" ? "Select Call Outcome" : "Select Outcome",
          status: "New",
          priority: "Low",
          owner: "Shreshth Dubey",
          teamMembers: [],
          notes: ""

        setIsDrawerOpen(true);

          contacts: activity.contacts || "Select Contacts",

          direction: activity.direction || "Select Direction",
          purpose: activity.purpose || "Select Purpose",
          outcome: activity.outcome || "Select Outcome",
          status: activity.status || "New",
          priority: activity.priority || "Low",
          owner: activity.owner || "Shreshth Dubey",

        e.preventDefault();
        if (!formData.title.trim()) {
          alert("Please enter an Activity Title.");
          return;

        const actDate = dayjs(formData.activityDate);
        const now = dayjs(currentTime);
        const isFutureAtSave = actDate.isSameOrAfter(now);

        const targetId = editingActivity ? editingActivity.id : `ACT-${Date.now().toString().slice(-4)}`;
        const remId = `REM-${targetId}`;

        // Clear prior dismissal and snooze state when an activity is created or rescheduled
        setDismissedReminders((prev) => prev.filter((id) => id !== remId));
        setSnoozedReminders((prev) => {
          const next = { ...prev };
          delete next[remId];
          return next;
        });

        // Grace period during demos so popup does not slam immediately after clicking Save
        setJustSavedOrChangedTime(true);
        setTimeout(() => setJustSavedOrChangedTime(false), 3000);

          // Edit Activity
          const updated = activities.map((act) => {
            if (act.id === editingActivity.id) {
              return {
                ...act,
                ...formData,
                id: act.id,
                hasReminder: isFutureAtSave

            }
            return act;

          setActivities(updated);
          showToast(`Activity "${formData.title}" updated successfully.`);

          // Create Activity
          const newAct = {
            ...formData,
            id: targetId,
            hasReminder: isFutureAtSave,
            createdAt: currentTime
          };
          setActivities([newAct, ...activities]);
          showToast(`Activity "${newAct.title}" created.`);
        }

        setIsDrawerOpen(false);
      };

        if (confirm("Are you sure you want to delete this activity?")) {
          setActivities(activities.filter((a) => a.id !== id));
          showToast("Activity deleted.");

      };

      const handleSaveSetting = (settingId, newMinutes) => {
        const updated = settings.map((s) => {
          if (s.id === settingId) {
            return {
              ...s,
              durationMinutes: parseInt(newMinutes),
              lastModified: dayjs().format("MMM D, YYYY, h:mm:ss A"),

          const matchesQuery = !searchQuery ||

            type: "warning",
            text: `Calculated trigger (${trigger.format("h:mm A")}) is already in the past relative to current time (${now.format("h:mm A")}).`

                          <option value="Not Interested">Not Interested</option>
                          <option value="Pending">Pending</option>
                        </select>
                      </div>

                      <div>
                        <label className="freight-label">
                          Status<span className="required-star">*</span>
                        </label>
                        <select
                          value={formData.status}
                          onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                          required
                          className="freight-select"
                        >
                          <option value="New">New</option>
                          <option value="In Progress">In Progress</option>
                          <option value="Completed">Completed</option>
                          <option value="Cancelled">Cancelled</option>
                        </select>
                      </div>
                    </div>

                    {/* Row: Priority & Owner */}
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="freight-label">Priority</label>
                        <select
                          value={formData.priority}
                          onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                          className="freight-select"
                        >
                          <option value="Low">Low</option>
                          <option value="Medium">Medium</option>
                          <option value="High">High</option>
                        </select>
                      </div>

                      <div>
                        <label className="freight-label">Owner</label>
                        <select
                          value={formData.owner}
                          onChange={(e) => setFormData({ ...formData, owner: e.target.value })}
                          className="freight-select"
                        >
                          <option value="Shreshth Dubey">Shreshth Dubey</option>
                          <option value="Vikram Seth">Vikram Seth</option>
                          <option value="Pooja Sharma">Pooja Sharma</option>
                        </select>
                      </div>
                    </div>

                    {/* Other Team Members */}
                    <div>
                      <label className="freight-label">Other Team Members</label>
                      <select className="freight-select">
                        <option value="">Select Team Members</option>
                        <option value="Vikram Seth">Vikram Seth</option>
                        <option value="Pooja Sharma">Pooja Sharma</option>
                        <option value="Amit Roy">Amit Roy</option>
                      </select>
                    </div>

                    {/* Notes Textarea */}
                    <div>
                      <label className="freight-label">Notes</label>
                      <textarea
                        rows="3"
                        placeholder="Enter notes"
                        value={formData.notes}
                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                        className="freight-input resize-y"
                      ></textarea>
                    </div>

                  </form>

                  {/* Drawer Fixed Footer */}
                  <div className="px-6 py-3.5 border-t border-[#e5e7eb] bg-white flex items-center justify-end space-x-3 flex-shrink-0">
                    <button
                      type="button"
                      onClick={() => setIsDrawerOpen(false)}
                      className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold rounded transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveActivity}
                      className="btn-freight-primary px-5 py-2 text-xs font-semibold rounded shadow-sm"
                    >
                      Save
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* ON-SCREEN REAL-TIME REMINDER POP-UP MODAL            */}
            {/* Appears in center of screen no matter what screen user is on */}
            {/* ==================================================== */}
            {activeAlertModalReminder && (() => {
              const targetActivity = activities.find(a => a.id === activeAlertModalReminder.activityId);

              const getActivityIcon = (type) => {
                switch ((type || "").toLowerCase()) {
                  case "calls": return "fa-solid fa-phone";
                  case "meeting": return "fa-solid fa-calendar-check";
                  case "email": return "fa-solid fa-envelope";
                  case "task": return "fa-solid fa-list-check";
                  default: return "fa-solid fa-bell";
                }
              };

              const contactInfo = activeAlertModalReminder.contacts || (targetActivity && targetActivity.contacts) || "";

              return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4">
                  {/* Dark Backdrop */}
                  <div 
                    className="fixed inset-0 bg-black/50 backdrop-blur-[2px] transition-opacity duration-200" 
                    onClick={() => handleDismissReminder(activeAlertModalReminder.id)}
                  ></div>

                  {/* Modal Card */}
                  <div className="relative bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-md overflow-hidden animate-scale-in z-[210]">
                    
                    {/* Header: Freightoscope Navy Blue (#16325c) */}
                    <div className="bg-[#16325c] px-5 py-3.5 flex items-center justify-between text-white shadow-sm">
                      <div className="flex items-center space-x-2.5">
                        <i className={`${getActivityIcon(activeAlertModalReminder.activityType)} text-amber-400 text-base`}></i>
                        <h3 className="font-bold text-sm text-white tracking-wide">Activity Reminder</h3>
                      </div>
                      <button
                        onClick={() => handleDismissReminder(activeAlertModalReminder.id)}
                        className="text-white/70 hover:text-white text-lg font-light transition-colors cursor-pointer p-1"
                        title="Dismiss Reminder"
                      >
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>

                    {/* Body Content */}
                    <div className="p-5 space-y-3.5">
                      {/* Subject / Title */}
                      <div>
                        <h2 className="text-base font-bold text-gray-900 leading-snug">
                          {activeAlertModalReminder.subject}
                        </h2>
                      </div>

                      {/* Key Details Container */}
                      <div className="bg-slate-50 border border-slate-200/90 rounded-lg p-3.5 space-y-2.5 text-xs text-gray-700">
                        <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                          <div className="flex items-center space-x-2 text-gray-600 font-medium">
                            <i className="fa-regular fa-clock text-[#0070d2] text-xs"></i>
                            <span>Scheduled Time:</span>
                          </div>
                          <span className="font-bold text-[#16325c]">
                            {formatDateTime(activeAlertModalReminder.activityDate)}
                          </span>
                        </div>

                        {activeAlertModalReminder.party && (
                          <div className="flex items-start justify-between space-x-2">
                            <div className="flex items-center space-x-2 text-gray-600 font-medium min-w-[90px]">
                              <i className="fa-solid fa-building text-[#0070d2] text-xs"></i>
                              <span>Party:</span>
                            </div>
                            <span className="font-semibold text-gray-900 text-right">{activeAlertModalReminder.party}</span>
                          </div>
                        )}

                        {activeAlertModalReminder.opportunity && (
                          <div className="flex items-start justify-between space-x-2">
                            <div className="flex items-center space-x-2 text-gray-600 font-medium min-w-[90px]">
                              <i className="fa-solid fa-briefcase text-[#0070d2] text-xs"></i>
                              <span>Opportunity:</span>
                            </div>
                            <span className="font-semibold text-gray-900 text-right">{activeAlertModalReminder.opportunity}</span>
                          </div>
                        )}

                        {contactInfo && (
                          <div className="flex items-start justify-between space-x-2">
                            <div className="flex items-center space-x-2 text-gray-600 font-medium min-w-[90px]">
                              <i className="fa-solid fa-address-book text-[#0070d2] text-xs"></i>
                              <span>Contact:</span>
                            </div>
                            <span className="font-semibold text-gray-900 text-right">{contactInfo}</span>
                          </div>
                        )}
                      </div>

                      {/* Action Buttons Row */}
                      <div className="pt-2 flex items-center justify-between border-t border-gray-100">
                        {/* View Activity */}
                        <button
                          onClick={() => {
                            if (targetActivity) {
                              handleOpenEditDrawer(targetActivity);
                            } else {
                              showToast("Activity details not found.");
                            }
                          }}
                          className="px-3 py-1.5 bg-white hover:bg-slate-100 border border-gray-300 text-gray-700 rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1.5 cursor-pointer shadow-xs"
                          title="Open Activity Details"
                        >
                          <i className="fa-solid fa-arrow-up-right-from-square text-[#0070d2]"></i>
                          <span>View Activity</span>
                        </button>

                        {/* Snooze & Dismiss */}
                        <div className="flex items-center space-x-1.5">
                          <button
                            onClick={() => handleSnoozeReminder(activeAlertModalReminder.id, 5)}
                            className="px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1 cursor-pointer"
                          >
                            <i className="fa-solid fa-clock-rotate-left text-amber-700"></i>
                            <span>Snooze (5m)</span>
                          </button>

                          <button
                            onClick={() => handleSnoozeReminder(activeAlertModalReminder.id, 15)}
                            className="px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1 cursor-pointer"
                          >
                            <i className="fa-solid fa-clock-rotate-left text-amber-700"></i>
                            <span>Snooze (15m)</span>
                          </button>

                          <button
                            onClick={() => handleDismissReminder(activeAlertModalReminder.id)}
                            className="px-3 py-1.5 bg-[#16325c] hover:bg-[#0f2341] text-white rounded-lg text-xs font-semibold transition-colors shadow-xs flex items-center space-x-1 cursor-pointer"
                          >
                            <i className="fa-solid fa-check"></i>
                            <span>Dismiss</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* ==================================================== */}
            {/* NOTIFICATIONS POPOVER (EMERGES FROM BELL ICON AT BOTTOM-LEFT) */}
            {/* Matches exact Freightoscope Notifications design     */}
            {/* ==================================================== */}
            {isNotificationOpen && (
              <div className="fixed inset-0 z-50 overflow-hidden" onClick={() => setIsNotificationOpen(false)}>
                {/* Subtle Backdrop */}
                <div className="fixed inset-0 bg-black/30 backdrop-blur-[1px]"></div>

                {/* Notifications Drawer / Popover Panel - emerging directly above the bottom-left bell icon */}
                <div
                  className="fixed bottom-[44px] left-[130px] w-[560px] max-w-[calc(100vw-140px)] h-[640px] max-h-[calc(100vh-55px)] bg-white rounded-t-xl rounded-r-xl shadow-2xl z-[100] border border-gray-300 flex flex-col drawer-slide-in overflow-hidden"
                  style={{ transformOrigin: 'bottom left' }}
                  onClick={(e) => e.stopPropagation()}
                >

                  {/* Header: Exact Freightoscope Navy Blue */}
                  <div className="bg-[#16325c] px-6 py-4 flex items-center justify-between shadow-sm flex-shrink-0">
                    <h2 className="text-xl font-bold text-white tracking-wide">Notifications</h2>
                    <button
                      onClick={() => setIsNotificationOpen(false)}
                      className="text-white hover:text-gray-200 text-xl font-light transition-colors"
                      title="Close Notifications"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  {/* Sub-Header: Filter Tabs & Pill Action Buttons */}
                  <div className="px-6 pt-3 pb-2 border-b border-gray-200 flex items-center justify-between bg-white text-sm flex-shrink-0">
                    {/* Left Sub-Tabs */}
                    <div className="flex items-center space-x-6">
                      <button
                        onClick={() => setNotifTab("all")}
                        className={`pb-2 transition-colors ${
                          notifTab === "all" ? "text-[#16325c] font-bold border-b-2 border-[#16325c]" : "text-gray-600 hover:text-gray-900 font-medium"
                        }`}
                      >
                        All
                      </button>
                      <button
                        onClick={() => setNotifTab("read")}
                        className={`pb-2 transition-colors ${
                          notifTab === "read" ? "text-[#16325c] font-bold border-b-2 border-[#16325c]" : "text-gray-600 hover:text-gray-900 font-medium"
                        }`}
                      >
                        Read
                      </button>
                      <button
                        onClick={() => setNotifTab("unread")}
                        className={`pb-2 transition-colors ${
                          notifTab === "unread" ? "text-[#16325c] font-bold border-b-2 border-[#16325c]" : "text-gray-600 hover:text-gray-900 font-medium"
                        }`}
                      >
                        Unread
                      </button>
                    </div>

                    {/* Right Pill Buttons */}
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={handleDismissAllReminders}
                        className="border border-red-400 text-red-500 hover:bg-red-50 px-3.5 py-1 rounded-full text-xs font-medium transition-colors"
                      >
                        Dismiss All
                      </button>
                      <button
                        onClick={handleMarkAllRead}
                        className="border border-blue-400 text-blue-600 hover:bg-blue-50 px-3.5 py-1 rounded-full text-xs font-medium transition-colors"
                      >
                        Mark All Read
                      </button>
                    </div>
                  </div>

                  {/* Search Input Bar */}
                  <div className="px-6 py-3 bg-white flex-shrink-0">
                    <div className="relative">
                      <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-sm"></i>
                      <input
                        type="text"
                        placeholder="Search here..."
                        value={notifSearchQuery}
                        onChange={(e) => setNotifSearchQuery(e.target.value)}
                        className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-xs text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 shadow-sm"
                      />
                    </div>
                  </div>

                  {/* Notification Items List */}
                  <div className="flex-1 overflow-y-auto px-6 py-2 space-y-3 bg-white">
                    {filteredNotificationReminders.length === 0 ? (
                      <div className="text-center py-16 text-gray-400">
                        <i className="fa-regular fa-bell-slash text-4xl mb-3 text-gray-300"></i>
                        <p className="text-sm font-medium text-gray-500">No notifications found</p>
                      </div>
                    ) : (
                      filteredNotificationReminders.map((rem) => (
                        <div
                          key={rem.id}
                          className="bg-[#e9ecef] hover:bg-[#e2e6ea] border border-gray-200/80 rounded-xl p-3.5 relative transition-all"
                        >
                          <div className="flex items-start space-x-3.5">
                            {/* User Avatar Circle */}
                            <div className="w-11 h-11 rounded-full bg-[#d0e1f9] flex-shrink-0 flex items-center justify-center text-[#5586c5] shadow-xs">
                              <i className="fa-solid fa-user text-lg"></i>
                            </div>

                            {/* Main Body */}
                            <div className="flex-1 pr-24">
                              <h4 className="font-bold text-sm text-gray-900 leading-snug mb-1">
                                {rem.subject}
                              </h4>
                              
                              <div className="text-xs text-gray-700 font-medium mb-0.5">
                                {formatDateShort(rem.activityDate)}
                              </div>

                              <div className="text-xs text-gray-500">
                                From: {rem.owner || "Shreshth Dubey"} {rem.party ? `• Party: ${rem.party}` : ""}
                              </div>
                            </div>

                            {/* Top Right: Clock Timestamp & Trash Can Icon */}
                            <div className="absolute top-3.5 right-4 text-right flex flex-col items-end space-y-2">
                              <span className="text-[11px] text-gray-600 font-medium flex items-center space-x-1">
                                <i className="fa-regular fa-clock text-[11px] text-gray-500"></i>
                                <span>{dayjs(rem.reminderDate).format("ddd MMM D YYYY HH:mm")}</span>
                              </span>

                              <button
                                onClick={() => handleDismissReminder(rem.id)}
                                title="Delete Notification"
                                className="text-red-500 hover:text-red-700 p-0.5 transition-colors cursor-pointer"
                              >
                                <i className="fa-solid fa-trash-can text-sm"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Panel Footer */}
                  <div className="px-6 py-3 border-t border-gray-200 bg-gray-50 flex items-center justify-between flex-shrink-0">
                    <div className="text-xs text-gray-600">
                      <span className="font-semibold text-gray-900">{reminders.filter((r) => !r.isDismissed).length}</span> Total Notifications
                    </div>
                    <button
                      onClick={() => setIsNotificationOpen(false)}
                      className="px-4 py-1.5 bg-[#16325c] hover:bg-[#0f2341] text-white rounded text-xs font-semibold transition-colors"
                    >
                      Close
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* Terms of Service Footer */}
            <footer className="absolute bottom-1 right-4 text-[11px] text-[#0070d2] pointer-events-none">
              Terms of Service (1.0.17.0)
            </footer>

            {/* ==================================================== */}
            {/* MINIMAL FLOATING DEV TIME TOOL (DISCREET BOTTOM-RIGHT PILL) */}
            {/* Minimal dev/wa tool style, not taking main UI feature space */}
            {/* ==================================================== */}
            <div className="fixed bottom-3 right-5 z-40">
              {!isDevToolOpen ? (
                <button
                  onClick={() => setIsDevToolOpen(true)}
                  className="bg-[#16325c] hover:bg-[#0f2341] text-white border border-[#0070d2]/50 px-3.5 py-1.5 rounded-full shadow-lg text-xs font-semibold flex items-center space-x-2 transition-all hover:scale-105 cursor-pointer"
                  title="Click to adjust simulated time"
                >
                  <i className="fa-regular fa-clock text-amber-300 text-sm"></i>
                  <span className="font-mono text-xs font-bold text-white">
                    {dayjs(currentTime).format("h:mm A")}
                  </span>
                  {useCustomTime && (
                    <span className="bg-amber-500 text-black text-[9px] font-extrabold px-1.5 py-0.2 rounded-full uppercase font-sans">
                      SIM
                    </span>
                  )}
                </button>
              ) : (
                <div className="bg-slate-900/95 text-slate-200 border border-slate-700 rounded-xl shadow-2xl p-3.5 text-xs font-sans w-[340px] backdrop-blur text-slate-300 space-y-2.5 drawer-slide-in">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <div className="flex items-center space-x-2">
                      <i className="fa-regular fa-clock text-amber-400 text-xs"></i>
                      <span className="font-bold text-white font-mono uppercase tracking-wider text-[11px]">Customize Timing</span>
                      {useCustomTime ? (
                        <span className="bg-amber-500 text-black font-bold text-[9px] px-1.5 py-0.5 rounded">CUSTOM</span>
                      ) : (
                        <span className="bg-emerald-600 text-white font-bold text-[9px] px-1.5 py-0.5 rounded">REAL-TIME</span>
                      )}
                    </div>
                    <button
                      onClick={() => setIsDevToolOpen(false)}
                      className="text-slate-400 hover:text-white text-xs px-1"
                      title="Minimize"
                    >
                      <i className="fa-solid fa-minus"></i>
                    </button>
                  </div>

                  <div className="flex items-center justify-between space-x-2">
                    <span className="text-[11px] text-slate-400 font-medium">Clock Mode:</span>
                    <div className="flex items-center space-x-1 bg-slate-800 p-0.5 rounded border border-slate-700">
                      <button
                        onClick={handleResetRealTime}
                        className={`px-2 py-0.5 rounded text-[10px] font-semibold transition-colors ${
                          !useCustomTime ? "bg-emerald-600 text-white" : "text-slate-400 hover:text-slate-200"
                        }`}
                      >
                        Real Time
                      </button>
                      <button
                        onClick={() => setUseCustomTime(true)}
                        className={`px-2 py-0.5 rounded text-[10px] font-semibold transition-colors ${
                          useCustomTime ? "bg-amber-500 text-slate-950 font-bold" : "text-slate-400 hover:text-slate-200"
                        }`}
                      >
                        Simulated
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2 pt-1">
                    <div className="flex items-center space-x-2">
                      <input
                        type="datetime-local"
                        value={customTime}
                        onChange={(e) => {
                          setCustomTime(e.target.value);
                        }}
                        className="bg-slate-800 border border-slate-700 text-white text-xs rounded px-2 py-1 flex-1 font-mono focus:outline-none focus:border-amber-500"
                      />
                    </div>

                    <div className="flex items-center space-x-1 justify-between pt-0.5">
                      <span className="text-[10px] text-slate-400 font-mono">Fast-Forward:</span>
                      <div className="flex items-center space-x-1">
                        <button
                          onClick={() => handleFastForward(5)}
                          className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-mono text-[10px] px-2 py-0.5 rounded cursor-pointer"
                        >
                          +5m
                        </button>
                        <button
                          onClick={() => handleFastForward(15)}
                          className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-mono text-[10px] px-2 py-0.5 rounded cursor-pointer"
                        >
                          +15m
                        </button>
                        <button
                          onClick={() => handleFastForward(60)}
                          className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-mono text-[10px] px-2 py-0.5 rounded cursor-pointer"
                        >
                          +1h
                        </button>
                        <button
                          onClick={() => handleFastForward(1440)}
                          className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-mono text-[10px] px-2 py-0.5 rounded cursor-pointer"
                        >
                          +1d
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Explicit Apply Action Button */}
                  <div className="pt-2 border-t border-slate-800">
                    <button
                      onClick={handleApplyCustomTime}
                      className="w-full py-1.5 bg-[#0070d2] hover:bg-[#005fb3] text-white font-bold rounded text-xs transition-colors flex items-center justify-center space-x-1.5 cursor-pointer shadow-sm"
                    >
                      <i className="fa-solid fa-check text-xs"></i>
                      <span>Apply</span>
                    </button>
                  </div>

                  <div className="text-[10px] text-slate-400 font-mono pt-1 flex items-center justify-between">
                    <span>Active Clock: <strong className="text-amber-300">{dayjs(currentTime).format("D MMM, h:mm A")}</strong></span>
                    {useCustomTime && (
                      <button onClick={handleResetRealTime} className="text-amber-400 hover:underline text-[10px] cursor-pointer">
                        Reset to Now
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>

          </main>
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FreightoscopeApp />);
  </script>
</body>
</html>
